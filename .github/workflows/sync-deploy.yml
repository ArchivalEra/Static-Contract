name: sync-deploy
# main push → 派生 catalogue（严格校验）+ 构建站点 → orphan 单提交强推 deploy 分支。
# 两条镜像通道从 deploy 分支取（CF Worker 运行期回源、EdgeOne 静态树）。
# 2026-11-04 撤掉 GitHub Pages：纯静态托管无服务端可编程能力，**取不了 release 字节**
# （fetch 不跟 HTML 跳转，_redirects 也不被支持），留着只会让人以为它是可用通道。
# deploy 分支永远只有一个无父提交（当前站点产物），无历史膨胀。
#
# 也定时跑：catalogue 是**关于 release 现状的实测**，上游发新 release 不一定推我这个仓。
# 定时是兜底（上游变更 ≤6h 内可见）；任何一步失败都不会覆盖上次的好结果。

on:
  push:
    branches: [main]
  schedule:
    # 兜底：上游发 release 不会推我仓。
    # 6h → 1h（2026-11-02，extra-content mail/007 实测）：上游「删旧 tag + 发新 tag」后，
    # catalogue 会在一整个 6h 窗口里指向已删除的 tag（实测两条 base 全 404）。
    # 1h 把窗口缩到可接受范围；成本可接受（派生只拉 manifest，不拉 asset）。
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # ★ 一个镜像源 = 一个 deploy 分支（用户裁定 2026-11-04：「出两个 deploy 分支
    #   分别叫 deploy-eo 和 deploy-cf，这样甚至以后加更多源也行」）。
    #   每条站点线派生自己的 catalogue（base 指向该源的镜像 host），
    #   于是「三处 catalogue 逐字节相同」不再成立 —— 改为「每处自洽」。
    #   加镜像 = 加一行矩阵项 + 一个分支 + 托管方监听。
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: deploy-eo
            mirror: https://static.isui.ren
            label: EdgeOne
          - branch: deploy-cf
            mirror: https://static.mango-mesa.ccwu.cc
            label: Cloudflare
    steps:
      - uses: actions/checkout@v4

      - name: 构建器自证（含「不收录 release 件」闸门自证）
        run: python3 scripts/build-site.py --selftest

      # 严格派生 catalogue（用户裁定：坏的从未上架，客户端零错误处理）。
      # 任一 release 不过 G1–G6 就不进 array（记入 excluded 并发布）；
      # 任一 **source 取数失败** ⇒ 本步红 ⇒ 后续构建/部署全部中止，
      # 三条通道保持上次的好结果 —— 绝不发布一个「所有 release 都消失」的空目录。
      - name: 派生 catalogue（严格校验，坏的不上架）
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_MIRROR: ${{ matrix.mirror }}
        run: |
          set -euo pipefail
          echo "mirror: $SC_MIRROR → branch ${{ matrix.branch }}"
          python3 scripts/sync-catalogue.py --selftest
          python3 scripts/sync-catalogue.py --out "$RUNNER_TEMP/catalogue.json"
          # 同时放一份到仓根，供站点语言闸门 H4 检查（它要读真实排除原因）
          cp "$RUNNER_TEMP/catalogue.json" site/catalogue.live.json
          echo "CATALOGUE_DERIVED=$RUNNER_TEMP/catalogue.json" >> "$GITHUB_ENV"

      - name: 站点闸门（英文 / 废弃标 / 链接）—— 构建前，查源与 catalogue
        run: python3 zreflect/check_site_lang.py

      - name: 构建站点
        run: python3 scripts/build-site.py --out site/dist

      - name: 发布到 ${{ matrix.branch }} 分支（orphan 单提交，强推）
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          cp -a site/dist/. "$d/"
          cd "$d"
          BRANCH="${{ matrix.branch }}"
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name=static-contract-bot \
              -c user.email=ArchivalEra@users.noreply.github.com \
              commit -qm "$BRANCH: sync from main@${SHA::7} [skip ci]"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin "$BRANCH"

      # ── 触发 EdgeOne 通道重建（2026-11-01 实测补的最后一环）──
      # EO 静态树住在 shirone 的 `isui.ren-heart` 仓 deploy 分支，由**他们**的
      # `.github/workflows/deploy.yml` 从**我仓 deploy 分支**取字节。也就是说：
      # 我推 deploy 分支**不会**自动触发他们跑 —— 实测我推完新产物后 EO 仍停在
      # 上一次（比 Pages 落后一个版本），必须有人去他们仓点一下。
      # ⇒ 这里正面 dispatch 他们的 workflow（workflow_dispatch 已存在）。
      # 仅当 secret HEART_DISPATCH_TOKEN 配置了才跑：缺 token 时**明说跳过**，
      # 不让验收闸门去替一个没发生的动作背锅（那会把真失败伪装成环境缺陷）。
      - name: 触发 EdgeOne 通道（dispatch shirone 的 deploy workflow）
        if: matrix.branch == 'deploy-eo'
        env:
          TOKEN: ${{ secrets.HEART_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::未配置 HEART_DISPATCH_TOKEN —— EdgeOne 通道不会自动跟新，"
            echo "::warning::它会停在上一次构建，直到 shirone 侧有人手动触发。"
            echo "EDGEONE_DISPATCHED=skipped" >> "$GITHUB_ENV"
            exit 0
          fi
          # 取 workflow id：失败必须立刻红。不加 -f 的话 401/403 也会打印
          # 一串 401 然后往下走 —— 那种「明明没 dispatch 成功却写了
          # EDGEONE_DISPATCHED=yes」会让验收闸门白等 5 分钟后报「EO 没吃到」，
          # 把鉴权失败伪装成通道缺陷。这正是本文件上半段批评的那类错。
          WF=$(curl -sSf -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/ArchivalEra/isui.ren-heart/actions/workflows \
            | python3 -c "import json,sys; print(next(w['id'] for w in json.load(sys.stdin)['workflows'] if w['name']=='deploy'))")
          echo "heart deploy workflow id = $WF"
          # dispatch：同样必须 -f。202 是成功（不是 200），所以判 2xx 而不是 200。
          CODE=$(curl -sSf -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ArchivalEra/isui.ren-heart/actions/workflows/$WF/dispatches" \
            -d '{"ref":"main"}') || {
              echo "::error::dispatch 失败（HTTP ${CODE:-?}）——检查 HEART_DISPATCH_TOKEN 是否有该仓 Actions:write"
              exit 1
            }
          echo "dispatch HTTP $CODE（202 为成功）"
          echo "EDGEONE_DISPATCHED=yes" >> "$GITHUB_ENV"

      # ── 线上验收（本次事故的补丁，2026-11-01）──
      # 前面每一步都可能"绿"而线上仍是旧产物：CDN 缓存、外部托管方没重新
      # 构建（EO 由 shirone 的 CI 从我的 deploy 分支取，需先 dispatch）、
      # Pages 传播延迟。判据锚在**产物本身**（构建指纹 + verified_at），
      # 不是通道之间是否一致 —— 全都停在旧产物时，一致性照样成立。
      # 时序：dispatch 后 shirone 要 clone + 构建 + 推 deploy + EO 拉取，
      # 实测约 2-4 分钟，故 dispatch 过时给足 10 轮 × 30s；未 dispatch
      # （缺 token）时只给 6 轮 × 20s —— 那种情况下 EO 注定不会跟，闸门红
      # 是**如实报告**，不是误报。
      # ★ 在线死链探测：**内容指纹**，不是状态码。
      # EdgeOne 对不存在路径返回 200 + 兜底页（实测 611B），只看状态码会全绿。
      # 放在线上验收之后 —— 那时三个通道都已吃到本次产物。
      - name: 在线死链探测（本镜像源逐链接，指纹判定）
        env:
          SC_CHANNELS_ONLY: ${{ matrix.label }}
        run: |
          set -euo pipefail
          # 在线探测发现死链 ⇒ 红。**某通道不可达 ⇒ 也红**（「它没问题」没有证据）。
          # 若不希望某通道阻塞发布，把它的 base 从 site/channels.json 移除并写明原因。
          python3 zreflect/check_site_lang.py --online

      - name: 线上验收（本镜像源必须吃到本次产物）
        env:
          SC_CHANNELS_ONLY: ${{ matrix.label }}
        run: |
          set -euo pipefail
          python3 scripts/verify-channels.py --selftest
          if [ "${EDGEONE_DISPATCHED:-skipped}" = "yes" ]; then
            AT=10; WAIT=30
          else
            AT=6; WAIT=20
          fi
          python3 scripts/verify-channels.py \
            --expected site/dist \
            --channels site/channels.json \
            --attempts "$AT" --wait "$WAIT"
