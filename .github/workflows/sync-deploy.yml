name: sync-deploy
# main push → 派生 catalogue（严格校验）+ 构建站点 → orphan 单提交强推 deploy 分支。
# 两条镜像通道从 deploy 分支取（CF Worker 运行期回源、EdgeOne 静态树）。
# 2026-11-04 撤掉 GitHub Pages：纯静态托管无服务端可编程能力，**取不了 release 字节**
# （fetch 不跟 HTML 跳转，_redirects 也不被支持），留着只会让人以为它是可用通道。
# deploy 分支永远只有一个无父提交（当前站点产物），无历史膨胀。
#
# 也定时跑：catalogue 是**关于 release 现状的实测**，上游发新 release 不一定推我这个仓。
# 定时是兜底（上游变更 ≤6h 内可见）；任何一步失败都不会覆盖上次的好结果。

on:
  push:
    branches: [main]
  schedule:
    # 兜底：上游发 release 不会推我仓。
    # 6h → 1h（2026-11-02，extra-content mail/007 实测）：上游「删旧 tag + 发新 tag」后，
    # catalogue 会在一整个 6h 窗口里指向已删除的 tag（实测两条 base 全 404）。
    # 1h 把窗口缩到可接受范围；成本可接受（派生只拉 manifest，不拉 asset）。
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # ★ 一个镜像源 = 一个 deploy 分支（用户裁定 2026-11-04：「出两个 deploy 分支
    #   分别叫 deploy-eo 和 deploy-cf，这样甚至以后加更多源也行」）。
    #   每条站点线派生自己的 catalogue（base 指向该源的镜像 host），
    #   于是「三处 catalogue 逐字节相同」不再成立 —— 改为「每处自洽」。
    #   加镜像 = 加一行矩阵项 + 一个分支 + 托管方监听。
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: deploy-eo
            mirror: https://static.isui.ren
            label: EdgeOne
          - branch: deploy-cf
            mirror: https://static.mango-mesa.ccwu.cc
            label: Cloudflare
    steps:
      - uses: actions/checkout@v4

      - name: 构建器自证（含「不收录 release 件」闸门自证）
        run: python3 scripts/build-site.py --selftest

      # 严格派生 catalogue（用户裁定：坏的从未上架，客户端零错误处理）。
      # 任一 release 不过 G1–G6 就不进 array（记入 excluded 并发布）；
      # 任一 **source 取数失败** ⇒ 本步红 ⇒ 后续构建/部署全部中止，
      # 三条通道保持上次的好结果 —— 绝不发布一个「所有 release 都消失」的空目录。
      - name: 派生 catalogue（严格校验，坏的不上架）
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_MIRROR: ${{ matrix.mirror }}
        run: |
          set -euo pipefail
          echo "mirror: $SC_MIRROR → branch ${{ matrix.branch }}"
          python3 scripts/sync-catalogue.py --selftest
          python3 scripts/sync-catalogue.py --out "$RUNNER_TEMP/catalogue.json"
          # 同时放一份到仓根，供站点语言闸门 H4 检查（它要读真实排除原因）
          cp "$RUNNER_TEMP/catalogue.json" site/catalogue.live.json
          echo "CATALOGUE_DERIVED=$RUNNER_TEMP/catalogue.json" >> "$GITHUB_ENV"

      - name: 站点闸门（英文 / 废弃标 / 链接）—— 构建前，查源与 catalogue
        run: python3 zreflect/check_site_lang.py

      - name: 构建站点
        run: python3 scripts/build-site.py --out site/dist

      - name: 发布到 ${{ matrix.branch }} 分支（orphan 单提交，强推）
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          cp -a site/dist/. "$d/"
          cd "$d"
          BRANCH="${{ matrix.branch }}"
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name=static-contract-bot \
              -c user.email=ArchivalEra@users.noreply.github.com \
              commit -qm "$BRANCH: sync from main@${SHA::7} [skip ci]"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin "$BRANCH"

      # ── 线上验收（本次事故的补丁，2026-11-01）──
      # 前面每一步都可能"绿"而线上仍是旧产物：CDN 缓存、托管方没重新拉取、
      # 传播延迟。判据锚在**产物本身**（构建指纹 + verified_at），
      # 不是通道之间是否一致 —— 全都停在旧产物时，一致性照样成立。
      # 时序：两条站点线的边缘缓存都是 `cache-control: max-age=300`
      # （实测 EO 与 CF 各 300s）。站点路径若命中旧缓存，更新要等缓存过期
      # ⇒ 轮次必须覆盖 300s 以上，否则闸门会把「还没过期」报成「没吃到」。
      # ★ 在线死链探测：**内容指纹**，不是状态码。
      # 边缘对不存在路径可能返回 200 + 兜底页（旧的 isui.ren/static 就是
      # 200 + 611B 落地页），只看状态码会全绿。
      # 放在线上验收之后 —— 那时三个通道都已吃到本次产物。
      - name: 在线死链探测（本镜像源逐链接，指纹判定）
        env:
          SC_CHANNELS_ONLY: ${{ matrix.label }}
        run: |
          set -euo pipefail
          # 在线探测发现死链 ⇒ 红。**某通道不可达 ⇒ 也红**（「它没问题」没有证据）。
          # 若不希望某通道阻塞发布，把它的 base 从 site/channels.json 移除并写明原因。
          python3 zreflect/check_site_lang.py --online

      - name: 线上验收（本镜像源必须吃到本次产物）
        env:
          SC_CHANNELS_ONLY: ${{ matrix.label }}
        run: |
          set -euo pipefail
          python3 scripts/verify-channels.py --selftest
          # 轮次必须覆盖边缘缓存 TTL（两条线都是 max-age=300）：
          # 12 轮 × 30s = 360s > 300s。给少了，闸门会把「缓存还没过期」
          # 报成「通道没吃到产物」——那是误报，会让人去查并不存在的问题。
          python3 scripts/verify-channels.py \
            --expected site/dist \
            --channels site/channels.json \
            --attempts 12 --wait 30
