# 事实新鲜度与全部闸门的正面 CI 落点（Einfacht 原版，逐字 adopting）：
# reflect-hooks/pre-commit / pre-push 只装在跑过 install.sh 的机器上，
# 且可被 git push --no-verify 跳过 —— 只在自己方便时生效的闸门
# = 本仓最擅长的那种"从未跑过的闸门"。这里正面执行与本地 hook
# 同一条判据：facts --check（机器块 ↔ 台账）+ 发现式名录里的
# 全部闸门（check_facts_replay 含在内 ⇒ 台账每条 cmd 在 CI 里
# 真的被逐字执行）。闸门数目以发现式名录为准 —— 这里不写数字，
# 手写数字一定会漂。
name: gates

on:
  push: {}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 钉小版本 + check-latest（uTLS-Gone issue #4 的实战经验）：
      # runner 镜像缓存会滞后安全发布 —— 只写大版本（如 "3"）默认 check-latest: false，
      # 实测解析到旧镜像里打包的 patch；写大版本 ≠ 拿到修复版。显式钉小版本并强制
      # 解析最新 patch，让「CI 运行时」与「安全公告」对齐。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: true
      - name: 事实块与台账一致 + 发现式名录的全部闸门全绿
        run: |
          # 旋钮来源：**直接 source env 文件**。插件 einfacht-env.sh 靠 $0 定位
          # env（钩子语境成立），被 Actions step 脚本 source 时 $0 是临时脚本
          # ⇒ 静默加载空（缺文件不是错误是它的守卫）⇒ 旋钮回落三语默认名。
          # 不挂它，REFLECT_READMES 等回落 Einfacht 三语默认名 ⇒ 本地绿 CI 红。
          . reflect-hooks/Einfacht.env
          # 台账自证的**仪器**：make-manifest-v4.py 依赖 zstandard（本仓实测机器
          # 自带，CI 必须显式装 —— 仪器缺席时复跑闸门抓到的是"命令报错"，
          # 不是"值变了"，二者都红，但前者是环境缺陷不是事实翻案）。
          python3 -m pip install --quiet zstandard
          # 名录对账（缺声明 / 孤儿 / 旗标错 / 写而不跑的自证 / 幻影旋钮）
          python3 zreflect/registry.py --gates >/dev/null
          python3 zreflect/registry.py --selftest-modules >/dev/null
          python3 zreflect/facts.py --check "${REFLECT_DOC:-STATE.md}"
          # 执行面唯一产地（C1）：跑 runs_at="commit" 的闸门，聚合 ran/off/failed
          # （off 不是通过 —— 输出里单列）。别再 glob check_*.py。
          # REFLECT_REPLAY=off 与 reflect-hooks/Einfacht.env 同源同因（issue #28）：
          # principle.falsifiable 的 cmd 含 env_hint 档位自证，在「载体已接线」
          # 的仓里结构性必红；等上游修自证后移除。PRINCIPLES.md 是新版的
          # 原则纪律表（接受 = 文件存在），--check 会一并校验它。
          export REFLECT_REPLAY=off
          python3 zreflect/registry.py --run commit
      - name: 平台模块自证（gate / runner / knobs / registry / guard / ledger / render / facts）
        run: |
          for m in $(python3 zreflect/registry.py --selftest-modules); do
            echo "--- $m"; python3 "$m" --selftest || exit 1
          done
      # 参考客户端是发给下游抄的代码，它自己没有任何测试的话就会静默腐烂。
      # 这一步只跑 examples/ 自己的离线测试（fake fetch，不联网），与契约闸门无关，
      # 所以放在最后：它红了说明示例坏了，不说明契约坏了。
      # 26: the fixtures compress real bytes with `zlib.zstdCompressSync`, which
      # only exists from Node 22.15. Pinning an older minor risks resolving a
      # runtime where it is undefined and every zstd fixture fails for the wrong
      # reason. `check-latest` so the runner image's cached build does not lag the
      # security release line — same lesson as the Python step above.
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          check-latest: true
      - name: 参考客户端离线测试（examples/）
        working-directory: examples
        run: |
          set -euo pipefail
          npm install --no-save --silent tsx typescript @types/node
          npx tsc --noEmit -p tsconfig.json
          npx tsx --test test/*.test.ts
